name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # sqflite_common_ffi 가 테스트에서 시스템 SQLite 를 씁니다.
      - name: SQLite 준비
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      # .env 는 pubspec 에 asset 으로 선언되어 있어 없으면 빌드가 실패합니다.
      # 시크릿이 비어 있어도 파일 자체는 반드시 만들어야 합니다. 값이 비면
      # 앱은 로컬 전용 모드로 동작합니다.
      - name: .env 만들기
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}
          EOF

      # android/ 는 커밋하지 않고 여기서 만듭니다. Flutter 자신의 템플릿을
      # 쓰므로 AGP/Gradle 버전이 SDK 와 항상 맞습니다.
      - name: android 폴더 생성
        run: |
          flutter create . \
            --project-name photo_application \
            --org com.hongsytop \
            --platforms=android

      # flutter create 가 우리 소스를 덮어쓰지 않았는지 확인합니다.
      # --platforms 를 준 기존 프로젝트에서는 플랫폼 폴더만 추가되는 것이
      # 정상이지만, 조용히 깨지면 알아채기 어려운 종류의 사고라 못을 박습니다.
      - name: 소스가 그대로인지 확인
        run: |
          grep -q 'PhotoApp' lib/main.dart \
            || { echo "❌ lib/main.dart 가 템플릿으로 덮어써졌습니다."; exit 1; }
          test -f lib/core/db/app_database.dart \
            || { echo "❌ 소스 트리가 손상되었습니다."; exit 1; }
          echo "✅ 소스 트리 정상"

      - name: 사진 권한 주입
        run: bash scripts/patch_android_manifest.sh

      - name: 서명 keystore 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "✅ 업로드 keystore 로 서명합니다."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 시크릿이 없어 debug 키로 서명합니다. 빌드마다 서명이 달라져 기존 앱 위에 덮어쓰기 설치가 안 됩니다. README 의 keystore 설정을 한 번만 해두세요."
          fi

      - name: 서명 설정 패치
        run: python3 scripts/patch_android_signing.py

      - run: flutter pub get

      # 컴파일 에러·경고를 빌드보다 먼저, 더 읽기 쉬운 형태로 잡습니다.
      - name: 정적 분석
        run: flutter analyze

      - name: 테스트
        run: flutter test

      - name: APK 빌드
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --split-per-abi
          flutter build apk --release \
            --build-number=${{ github.run_number }}

      - name: 서명 확인
        run: |
          for apk in build/app/outputs/flutter-apk/*.apk; do
            echo "▶ $(basename "$apk")"
            "$JAVA_HOME/bin/keytool" -printcert -jarfile "$apk" 2>/dev/null \
              | grep -E "SHA256:|Owner:" || true
          done

      - name: APK 모으기
        run: |
          mkdir -p out
          N=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "out/photo-arm64-v8a-build$N.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/photo-armeabi-v7a-build$N.apk" || true
          cp build/app/outputs/flutter-apk/app-release.apk             "out/photo-universal-build$N.apk"
          ls -lh out/

      - name: 릴리스 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "빌드 #${{ github.run_number }}"
          body: |
            **커밋:** `${{ github.sha }}`
            **브랜치:** `${{ github.ref_name }}`

            ## 폰에 설치하기
            1. 폰에서 이 페이지를 열고 **`photo-arm64-v8a-build${{ github.run_number }}.apk`** 를 받으세요 (요즘 안드로이드 폰 대부분).
            2. 받은 파일을 눌러 "출처를 알 수 없는 앱 설치"를 허용하고 설치합니다.
            3. 처음 실행하면 사진 접근 권한을 물어봅니다. 허용하면 갤러리를 훑어 목록을 만듭니다.

            > CPU 를 잘 모르겠으면 `universal` 을 받으세요.

            이 앱은 사진을 **읽기만** 합니다. 사진을 고치거나 옮기거나 지우지 않고, 어디로도 올리지 않습니다.
          files: out/*.apk
          fail_on_unmatched_files: true

  cleanup:
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: 오래된 아티팩트 정리
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const res = await github.rest.actions.listArtifactsForRepo({ owner, repo, per_page: 100 });
            const cutoff = Date.now() - 7 * 24 * 60 * 60 * 1000;
            for (const a of res.data.artifacts) {
              if (new Date(a.created_at).getTime() < cutoff) {
                await github.rest.actions.deleteArtifact({ owner, repo, artifact_id: a.id });
              }
            }
