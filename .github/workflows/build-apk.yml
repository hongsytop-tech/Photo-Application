name: Build APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # sqflite_common_ffi 가 테스트에서 시스템 SQLite 를 씁니다.
      - name: SQLite 준비
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0

      # .env 는 pubspec 에 asset 으로 선언되어 있어 없으면 빌드가 실패합니다.
      # 시크릿이 비어 있어도 파일 자체는 반드시 만들어야 합니다. 값이 비면
      # 앱은 로컬 전용 모드로 동작합니다.
      - name: .env 만들기
        # 시크릿을 셸 스크립트 본문에 바로 끼워 넣지 않고 env 로 넘깁니다.
        # 값에 특수문자가 있어도 스크립트가 깨지지 않습니다.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          # 이 빌드가 동기화를 쓸 수 있는지 로그에 남깁니다. 값은 찍지 않고
          # 있는지 없는지만 봅니다. 시크릿을 등록하기 전에 시작된 빌드는
          # 로컬 전용으로 나오는데, 그걸 설치하고 나서야 알아채면 늦습니다.
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_ANON_KEY" ]; then
            echo "✅ Supabase 자격증명 있음 — 로그인·동기화가 켜진 빌드입니다."
          else
            echo "::warning::Supabase 자격증명이 없어 로컬 전용 빌드입니다. 사진·메모·태그·폴더는 모두 동작하지만 로그인과 기기 간 동기화는 꺼집니다."
          fi

      # android/ 는 커밋하지 않고 여기서 만듭니다. Flutter 자신의 템플릿을
      # 쓰므로 AGP/Gradle 버전이 SDK 와 항상 맞습니다.
      - name: android 폴더 생성
        run: |
          flutter create . \
            --project-name photo_application \
            --org com.hongsytop \
            --platforms=android

      # flutter create 가 우리 소스를 덮어쓰지 않았는지 확인합니다.
      # --platforms 를 준 기존 프로젝트에서는 플랫폼 폴더만 추가되는 것이
      # 정상이지만, 조용히 깨지면 알아채기 어려운 종류의 사고라 못을 박습니다.
      - name: 소스 확인 + 템플릿 잔재 제거
        run: |
          grep -q 'PhotoApp' lib/main.dart \
            || { echo "❌ lib/main.dart 가 템플릿으로 덮어써졌습니다."; exit 1; }
          test -f lib/core/db/app_database.dart \
            || { echo "❌ 소스 트리가 손상되었습니다."; exit 1; }

          # flutter create 는 test/widget_test.dart 를 새로 만든다. 그 템플릿은
          # 존재하지도 않는 MyApp 을 참조해 analyze 를 깨뜨린다. 우리 테스트는
          # test/ 아래 따로 있으므로 이 파일만 지운다.
          rm -f test/widget_test.dart

          test -f test/metadata_test.dart && test -f test/photo_key_test.dart \
            || { echo "❌ 테스트 파일이 사라졌습니다."; exit 1; }
          echo "✅ 소스 트리 정상"

      - name: 사진 권한 주입
        run: bash scripts/patch_android_manifest.sh

      # flutter create 가 넣는 아이콘은 어느 Flutter 앱이나 똑같아서 홈 화면에서
      # 다른 앱과 구분되지 않는다. 표준 라이브러리만 쓰는 스크립트라 러너에
      # 이미지 도구를 따로 얹지 않는다.
      - name: 런처 아이콘 생성
        run: |
          python3 scripts/make_launcher_icons.py

          RES=android/app/src/main/res
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_foreground ic_launcher_monochrome; do
              test -s "$RES/mipmap-$d/$f.png" \
                || { echo "❌ mipmap-$d/$f.png 가 없습니다."; exit 1; }
            done
          done
          test -s "$RES/mipmap-anydpi-v26/ic_launcher.xml" \
            || { echo "❌ 적응형 아이콘 정의가 없습니다."; exit 1; }
          test -s "$RES/values/ic_launcher_background.xml" \
            || { echo "❌ 적응형 아이콘 배경색이 없습니다."; exit 1; }
          echo "✅ 아이콘 17개 검증 통과"

      - name: 서명 keystore 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/upload-keystore.jks
            cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          EOF
            echo "✅ 업로드 keystore 로 서명합니다."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 시크릿이 없어 debug 키로 서명합니다. 빌드마다 서명이 달라져 기존 앱 위에 덮어쓰기 설치가 안 됩니다. README 의 keystore 설정을 한 번만 해두세요."
          fi

      - name: 서명 설정 패치
        run: |
          python3 scripts/patch_android_signing.py
          # Gradle 스크립트가 깨지면 원인을 한 번에 보려고 결과물을 남깁니다.
          echo "::group::패치된 android/app/build.gradle.kts"
          cat -n android/app/build.gradle.kts
          echo "::endgroup::"

      - run: flutter pub get

      # 컴파일 에러·경고를 빌드보다 먼저, 더 읽기 쉬운 형태로 잡습니다.
      #
      # --no-fatal-infos: 오류와 경고에서는 그대로 실패하되 info 는 통과시킵니다.
      # info 의 대부분은 서드파티 API 의 deprecation 이라, Flutter 나 패키지가
      # 새 버전을 낼 때마다 우리 코드가 그대로인데도 APK 빌드가 막힙니다.
      # 릴리스를 세우는 기준으로 삼기에는 맞지 않습니다.
      - name: 정적 분석
        run: flutter analyze --no-fatal-infos

      - name: 테스트
        run: flutter test

      - name: APK 빌드
        run: |
          # BUILD_NUMBER 를 코드에 직접 심습니다. versionCode 만으로는
          # --split-per-abi 가 더하는 ABI 오프셋과 뒤섞여 업데이트 비교가
          # 어긋납니다.
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }} \
            --split-per-abi
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --dart-define=BUILD_NUMBER=${{ github.run_number }}

      # 어떤 키로 서명됐는지 확인합니다.
      #
      # keytool -printcert -jarfile 로는 확인할 수 없습니다. 그건 옛 JAR(v1)
      # 서명만 읽는데 요즘 Flutter/AGP 는 APK Signature Scheme v2/v3 로만
      # 서명해서 아무것도 출력되지 않습니다. apksigner 가 맞는 도구입니다.
      - name: 서명 확인
        run: |
          APKSIGNER="$(ls "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)"
          if [ -z "$APKSIGNER" ]; then
            echo "::warning::apksigner 를 찾지 못해 서명 확인을 건너뜁니다."
            exit 0
          fi

          APK=build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          CERTS="$("$APKSIGNER" verify --print-certs "$APK" 2>/dev/null || true)"
          echo "$CERTS" | grep -E 'certificate DN:|certificate SHA-256 digest:' || true

          # 결론을 한 줄로 남깁니다. 디버그 키는 CN=Android Debug 로 나옵니다.
          if [ -z "$CERTS" ]; then
            echo "::warning::서명 정보를 읽지 못했습니다."
          elif echo "$CERTS" | grep -q 'CN=Android Debug'; then
            echo "::warning::임시 debug 키로 서명되었습니다 — 덮어쓰기 설치가 안 됩니다."
          else
            echo "✅ 업로드 keystore 로 서명된 APK 입니다."
          fi

      - name: APK 모으기
        run: |
          mkdir -p out
          N=${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk   "out/photo-arm64-v8a-build$N.apk"
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "out/photo-armeabi-v7a-build$N.apk" || true
          cp build/app/outputs/flutter-apk/app-release.apk             "out/photo-universal-build$N.apk"
          ls -lh out/

      - name: 릴리스 만들기
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-build-${{ github.run_number }}
          name: "빌드 #${{ github.run_number }}"
          body: |
            **커밋:** `${{ github.sha }}`
            **브랜치:** `${{ github.ref_name }}`

            ## 폰에 설치하기
            1. 폰에서 이 페이지를 열고 **`photo-arm64-v8a-build${{ github.run_number }}.apk`** 를 받으세요 (요즘 안드로이드 폰 대부분).
            2. 받은 파일을 눌러 "출처를 알 수 없는 앱 설치"를 허용하고 설치합니다.
            3. 처음 실행하면 사진 접근 권한을 물어봅니다. 허용하면 갤러리를 훑어 목록을 만듭니다.

            > CPU 를 잘 모르겠으면 `universal` 을 받으세요.

            이 앱은 사진을 **읽기만** 합니다. 사진을 고치거나 옮기거나 지우지 않고, 어디로도 올리지 않습니다.
          files: out/*.apk
          fail_on_unmatched_files: true

