name: photo_application
description: "폰에 저장된 사진에 메모·태그·가상 폴더를 붙여 관리하는 Android 앱."
publish_to: "none"
version: 0.1.0+1

environment:
  # Color.withValues / PopScope.onPopInvokedWithResult 를 쓰므로 하한이
  # 이만큼 필요합니다. CI 는 stable 최신을 씁니다.
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.5.1

  # 기기 갤러리 접근 (MediaStore) + 썸네일 ImageProvider
  photo_manager: ^3.2.0
  photo_manager_image_provider: ^2.1.0

  # 메타데이터 저장소 — 사진 수만 장 규모라 SharedPreferences 대신 SQLite.
  sqflite: ^2.3.3
  path: ^1.9.0

  # 사진 식별키(sha1) 계산
  crypto: ^3.0.3

  # 설정값 전용 로컬 저장 (DB 를 쓸 만큼 무겁지 않은 값들)
  shared_preferences: ^2.2.3

  # 런타임 설정
  flutter_dotenv: ^5.1.0

  # 백엔드 (메타데이터 동기화 전용)
  # 상한 고정: 2.15.0+ 는 passkeys 의존성을 끌어와 빌드가 깨진 전례가 있음.
  supabase_flutter: ">=2.5.6 <2.15.0"

  uuid: ^4.4.0
  intl: ^0.19.0
  cupertino_icons: ^1.0.8

  # 앱 내 자동 업데이트 — 설치된 버전 확인, APK 저장 위치, 설치 화면 띄우기
  package_info_plus: ^8.0.2
  path_provider: ^2.1.3
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # 데스크톱/CI 에서 SQLite 를 in-memory 로 띄워 서비스 계층을 실제로 돌려봅니다.
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  assets:
    - .env
